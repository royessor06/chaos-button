<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pour Gracia ❤️</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">

<style>
  :root {
    --bg-deep:    #060101;
    --bordeaux:   #5c0a1e;
    --rose:       #e63946;
    --pink:       #ff8fa3;
    --soft-pink:  #ffb3c1;
    --cream:      #f8e5e5;
    --gold:       #d4a574;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body { height: 100%; overflow: hidden; }

  body {
    background: radial-gradient(ellipse at 50% 45%, #1a0505 0%, #060101 65%, #000 100%);
    color: var(--cream);
    font-family: 'Inter', system-ui, sans-serif;
    font-weight: 300;
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
  }

  /* Vignette cinéma */
  body::after {
    content: '';
    position: fixed; inset: 0;
    pointer-events: none;
    background: radial-gradient(ellipse at center, transparent 40%, rgba(0,0,0,.75) 100%);
    z-index: 2;
  }

  /* =========================================================
     CANVAS DE FOND
     ========================================================= */
  #bg-canvas {
    position: fixed; inset: 0;
    width: 100%; height: 100%;
    z-index: 0;
  }

  /* =========================================================
     INTRO CINÉMATIQUE
     ========================================================= */
  #intro {
    position: fixed; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 30px;
    padding: 30px;
    text-align: center;
    background: radial-gradient(ellipse at center, #140303 0%, #000 85%);
    z-index: 100;
    transition: opacity 1.6s ease;
  }
  #intro.hidden { opacity: 0; pointer-events: none; }

  #intro .name {
    position: relative;
    font-family: 'Cormorant Garamond', serif;
    font-weight: 300;
    font-style: italic;
    font-size: clamp(3.5rem, 13vw, 8rem);
    letter-spacing: 0.02em;
    background: linear-gradient(135deg, var(--cream) 0%, var(--soft-pink) 45%, var(--rose) 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    animation: fadeUp 2s ease .5s both;
    padding: 0 .15em;
  }
  /* Halo derrière le prénom */
  #intro .name::before {
    content: '';
    position: absolute;
    top: 50%; left: 50%;
    width: 140%; height: 140%;
    transform: translate(-50%, -50%);
    background: radial-gradient(ellipse at center,
      rgba(230,57,70,.35) 0%,
      rgba(230,57,70,.12) 35%,
      transparent 70%);
    filter: blur(30px);
    z-index: -1;
    animation: haloPulse 4.5s ease-in-out infinite;
  }
  @keyframes haloPulse {
    0%, 100% { opacity: .8; transform: translate(-50%, -50%) scale(1); }
    50%      { opacity: 1;  transform: translate(-50%, -50%) scale(1.08); }
  }

  #intro .sub {
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-size: clamp(1rem, 2.4vw, 1.25rem);
    color: rgba(248,229,229,.6);
    letter-spacing: 0.02em;
    line-height: 1.7;
    max-width: 480px;
    animation: fadeUp 2s ease 1.8s both;
  }

  #enterBtn {
    margin-top: 14px;
    padding: 15px 40px;
    border: 1px solid rgba(255,179,193,.28);
    border-radius: 999px;
    background: rgba(230,57,70,.05);
    color: var(--cream);
    font-family: inherit;
    font-size: .92rem;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    cursor: pointer;
    backdrop-filter: blur(8px);
    box-shadow: 0 0 30px rgba(230,57,70,.15);
    transition: all .5s cubic-bezier(.22,1,.36,1);
    animation: fadeUp 2s ease 3s both;
  }
  #enterBtn:hover {
    transform: translateY(-2px);
    background: rgba(230,57,70,.14);
    box-shadow: 0 0 50px rgba(230,57,70,.4);
    border-color: rgba(255,179,193,.65);
  }
  #enterBtn:active { transform: translateY(0) scale(.97); }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(24px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* =========================================================
     SCÈNE PRINCIPALE
     ========================================================= */
  #stage {
    position: fixed; inset: 0;
    display: flex; align-items: center; justify-content: center;
    padding: 24px;
    text-align: center;
    z-index: 10;
    opacity: 0; pointer-events: none;
    transition: opacity 1.4s ease;
  }
  #stage.active { opacity: 1; pointer-events: auto; }

  .stage-inner {
    display: flex; flex-direction: column;
    align-items: center;
    max-width: 580px;
  }

  .eyebrow {
    font-size: .74rem;
    letter-spacing: 0.38em;
    text-transform: uppercase;
    color: rgba(255,179,193,.45);
    margin-bottom: 24px;
    font-weight: 400;
  }

  #title {
    font-family: 'Cormorant Garamond', serif;
    font-weight: 300;
    font-style: italic;
    font-size: clamp(2rem, 6vw, 3.4rem);
    line-height: 1.15;
    background: linear-gradient(135deg, var(--cream) 0%, var(--soft-pink) 70%, var(--pink) 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    transition: opacity .6s ease;
  }

  #message {
    margin-top: 34px;
    min-height: 3.2em;
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-size: clamp(1.05rem, 2.6vw, 1.32rem);
    line-height: 1.65;
    color: rgba(248,229,229,.85);
    opacity: 0;
    transform: translateY(8px);
    transition: opacity 1s ease, transform 1s ease;
    padding: 0 10px;
  }
  #message.show { opacity: 1; transform: translateY(0); }

  #mainButton {
    --progress: 0;
    position: relative;
    margin-top: 42px;
    padding: 18px 44px;
    border: 1px solid rgba(255,179,193,.32);
    border-radius: 999px;
    background: linear-gradient(135deg, rgba(230,57,70,.16), rgba(92,10,30,.32));
    color: var(--cream);
    font-family: inherit;
    font-size: 1rem;
    font-weight: 400;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    cursor: pointer;
    backdrop-filter: blur(10px);
    overflow: hidden;
    box-shadow:
      0 0 calc(40px + var(--progress) * 70px) rgba(230,57,70, calc(.22 + var(--progress) * .38)),
      inset 0 1px 0 rgba(255,255,255,.08);
    transition: transform .35s cubic-bezier(.22,1,.36,1),
                box-shadow .6s ease,
                border-color .4s ease;
  }
  #mainButton::before {
    content: '';
    position: absolute;
    top: 0; left: -60%;
    width: 40%; height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,.14), transparent);
    transform: skewX(-20deg);
    animation: shimmer 4.5s ease-in-out infinite;
    pointer-events: none;
  }
  @keyframes shimmer {
    0%, 65% { left: -60%; }
    100%    { left: 120%; }
  }
  #mainButton:hover {
    transform: translateY(-3px);
    border-color: rgba(255,179,193,.75);
  }
  #mainButton:active { transform: translateY(-1px) scale(.98); }
  #mainButton:disabled { opacity: .5; cursor: default; }

  /* =========================================================
     OVERLAYS D'ÉVÉNEMENTS
     ========================================================= */
  .event-overlay {
    position: fixed; inset: 0;
    display: flex; align-items: center; justify-content: center;
    background: rgba(0,0,0,.78);
    backdrop-filter: blur(10px);
    z-index: 60;
    padding: 30px;
    text-align: center;
    opacity: 0;
    transition: opacity .6s ease;
  }
  .event-overlay.show { opacity: 1; }

  .event-content {
    max-width: 420px;
    font-family: 'Cormorant Garamond', serif;
  }
  .event-title {
    font-style: italic;
    font-size: clamp(1.1rem, 3vw, 1.35rem);
    color: var(--soft-pink);
    margin-bottom: 22px;
    letter-spacing: 0.02em;
  }
  .event-bar {
    width: 100%;
    max-width: 300px;
    height: 3px;
    margin: 0 auto;
    background: rgba(255,179,193,.14);
    border-radius: 2px;
    overflow: hidden;
  }
  .event-fill {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, var(--rose), var(--soft-pink));
    border-radius: 2px;
    transition: width .2s ease;
    box-shadow: 0 0 12px rgba(230,57,70,.7);
  }
  .event-pct {
    margin-top: 14px;
    font-family: 'Inter', sans-serif;
    font-size: .8rem;
    letter-spacing: 0.25em;
    color: rgba(255,179,193,.65);
  }
  .event-verdict {
    margin-top: 26px;
    font-style: italic;
    font-size: clamp(1.15rem, 3vw, 1.4rem);
    color: var(--cream);
    opacity: 0;
    transition: opacity .8s ease;
  }
  .event-verdict.show { opacity: 1; }

  /* =========================================================
     BLACKOUT / MOMENT DE LA LUMIÈRE
     ========================================================= */
  #blackout {
    position: fixed; inset: 0;
    background: #000;
    z-index: 200;
    opacity: 0;
    pointer-events: none;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 40px;
    padding: 30px;
    text-align: center;
    transition: opacity 1.4s ease;
  }
  #blackout.active { opacity: 1; pointer-events: auto; }

  #light {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: radial-gradient(circle, var(--soft-pink) 0%, var(--rose) 40%, transparent 70%);
    box-shadow:
      0 0 30px 8px rgba(255,179,193,.6),
      0 0 80px 20px rgba(230,57,70,.35);
    opacity: 0;
    transform: scale(.2);
    transition: opacity 1.6s ease, transform 2.2s ease;
  }
  #light.active {
    opacity: 1;
    transform: scale(1);
    animation: lightPulse 3s ease-in-out infinite;
  }
  @keyframes lightPulse {
    0%, 100% { transform: scale(1);    filter: brightness(1); }
    50%      { transform: scale(1.25); filter: brightness(1.4); }
  }

  #preLetterText {
    position: absolute;
    top: 62%;
    left: 50%;
    transform: translate(-50%, 0);
    font-family: 'Cormorant Garamond', serif;
    font-weight: 300;
    font-style: italic;
    font-size: clamp(1.5rem, 5vw, 2.4rem);
    color: var(--cream);
    letter-spacing: 0.02em;
    text-align: center;
    max-width: 90vw;
    opacity: 0;
    transition: opacity 1.4s ease;
    white-space: nowrap;
  }
  #preLetterText.show { opacity: 1; }

  /* =========================================================
     LETTRE
     ========================================================= */
  #letter {
    position: fixed; inset: 0;
    z-index: 150;
    display: flex; align-items: center; justify-content: center;
    padding: 30px 20px;
    opacity: 0; pointer-events: none;
    transition: opacity 1.6s ease;
    overflow-y: auto;
  }
  #letter.active { opacity: 1; pointer-events: auto; }

  .letter-card {
    position: relative;
    width: 100%;
    max-width: 640px;
    margin: auto;
    padding: clamp(36px, 6vw, 68px) clamp(26px, 5vw, 56px);
    background: linear-gradient(160deg, rgba(30,7,10,.78), rgba(12,3,5,.88));
    border: 1px solid rgba(255,179,193,.14);
    border-radius: 20px;
    backdrop-filter: blur(22px);
    box-shadow:
      0 0 90px rgba(230,57,70,.14),
      inset 0 1px 0 rgba(255,255,255,.05);
    text-align: center;
  }
  .letter-card::before,
  .letter-card::after {
    content: '';
    position: absolute;
    width: 42px; height: 42px;
    border: 1px solid rgba(212,165,116,.4);
    pointer-events: none;
  }
  .letter-card::before { top: 16px; left: 16px;  border-right: none; border-bottom: none; }
  .letter-card::after  { bottom: 16px; right: 16px; border-left: none;  border-top: none; }

  #letterContent p {
    font-family: 'Cormorant Garamond', serif;
    font-weight: 300;
    font-size: clamp(1.1rem, 2.7vw, 1.36rem);
    line-height: 1.88;
    color: rgba(248,229,229,.92);
    letter-spacing: 0.005em;
    margin-bottom: .4em;
    opacity: 0;
    transform: translateY(10px);
    transition: opacity 1.1s ease, transform 1.1s ease;
  }
  #letterContent p.show { opacity: 1; transform: translateY(0); }
  #letterContent p.empty { height: .5em; margin: 0; }

  #letterContent p.signature {
    margin-top: 1.5em;
    font-style: italic;
    color: var(--soft-pink);
    font-size: clamp(1.15rem, 2.8vw, 1.4rem);
  }

  /* =========================================================
     FINALE — JE T'AIME
     ========================================================= */
  #finale {
    position: fixed; inset: 0;
    z-index: 250;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 40px;
    padding: 40px 20px;
    background: radial-gradient(ellipse at center, #140303 0%, #000 80%);
    opacity: 0; pointer-events: none;
    transition: opacity 1.8s ease;
    text-align: center;
  }
  #finale.active { opacity: 1; pointer-events: auto; }

  #bigText {
    font-family: 'Cormorant Garamond', serif;
    font-weight: 400;
    font-size: clamp(2.4rem, 9vw, 5rem);
    letter-spacing: 0.06em;
    color: var(--cream);
    text-shadow: 0 0 60px rgba(230,57,70,.7), 0 0 120px rgba(230,57,70,.35);
    min-height: 1.2em;
    white-space: nowrap;
  }
  #bigText span {
    display: inline-block;
    transition: opacity .5s ease, transform .5s ease;
  }

  #metaMessage {
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-weight: 300;
    font-size: clamp(1.1rem, 2.9vw, 1.4rem);
    line-height: 1.7;
    color: rgba(248,229,229,.8);
    max-width: 520px;
    opacity: 0;
    transform: translateY(14px);
    transition: opacity 1.6s ease, transform 1.6s ease;
  }
  #metaMessage.show { opacity: 1; transform: translateY(0); }

  #restartBtn {
    margin-top: 10px;
    padding: 14px 34px;
    border: 1px solid rgba(255,179,193,.28);
    border-radius: 999px;
    background: rgba(230,57,70,.05);
    color: var(--cream);
    font-family: inherit;
    font-size: .82rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    cursor: pointer;
    opacity: 0;
    transform: translateY(10px);
    transition: opacity 1.4s ease, transform 1.4s ease, background .3s ease, border-color .3s ease;
  }
  #restartBtn.show { opacity: 1; transform: translateY(0); }
  #restartBtn:hover {
    background: rgba(230,57,70,.15);
    border-color: rgba(255,179,193,.65);
  }

  /* =========================================================
     EFFETS : cœurs burst + glitch + flash
     ========================================================= */
  .burst-heart {
    position: fixed;
    pointer-events: none;
    z-index: 90;
    transform: translate(-50%, -50%);
    animation: burst 1.6s cubic-bezier(.22,1,.36,1) forwards;
    will-change: transform, opacity;
  }
  @keyframes burst {
    0%   { opacity: 1; transform: translate(-50%, -50%) scale(.3); }
    100% { opacity: 0; transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(1.2) rotate(180deg); }
  }

  body.glitching .stage-inner {
    animation: glitch .45s steps(2) 2;
  }
  @keyframes glitch {
    0%   { transform: translate(0,0);    filter: none; }
    25%  { transform: translate(-5px,3px); filter: hue-rotate(90deg) contrast(1.3); }
    50%  { transform: translate(4px,-3px); filter: hue-rotate(-90deg) contrast(.9); }
    75%  { transform: translate(-2px,-3px); filter: hue-rotate(180deg); }
    100% { transform: translate(0,0);    filter: none; }
  }

  body.rose-flash { animation: rosePulse 1.1s ease; }
  @keyframes rosePulse {
    0%, 100% { filter: none; }
    50%      { filter: hue-rotate(-15deg) saturate(1.5) brightness(1.18); }
  }

  /* =========================================================
     RESPONSIVE
     ========================================================= */
  @media (max-width: 480px) {
    #mainButton { padding: 16px 32px; font-size: .9rem; letter-spacing: 0.08em; }
    #message { margin-top: 26px; min-height: 3.6em; }
    #bigText { letter-spacing: 0.03em; }
    #preLetterText { white-space: normal; }
  }
</style>
</head>

<body>

  <canvas id="bg-canvas"></canvas>

  <!-- ==================== INTRO ==================== -->
  <div id="intro">
    <h1 class="name" id="introName"></h1>
    <p class="sub">J'ai passé un peu trop de temps à préparer ça…</p>
    <button id="enterBtn">Entre si tu veux découvrir</button>
  </div>

  <!-- ==================== SCÈNE PRINCIPALE ==================== -->
  <main id="stage">
    <div class="stage-inner">
      <p class="eyebrow">Un petit quelque chose pour toi</p>
      <h1 id="title">Touche le cœur</h1>
      <p id="message"></p>
      <button id="mainButton">Touche ici</button>
    </div>
  </main>

  <!-- ==================== BLACKOUT / LUMIÈRE ==================== -->
  <div id="blackout">
    <div id="light"></div>
    <p id="preLetterText"></p>
  </div>

  <!-- ==================== LETTRE ==================== -->
  <section id="letter">
    <div class="letter-card">
      <div id="letterContent"></div>
    </div>
  </section>

  <!-- ==================== FINALE ==================== -->
  <div id="finale">
    <h1 id="bigText"></h1>
    <p id="metaMessage">…et oui, j'ai vraiment codé tout ça juste pour toi. 😂❤️</p>
    <button id="restartBtn">Relire depuis le début</button>
  </div>

<script>
/* =========================================================
   ✏️ PERSONNALISATION — MODIFIE ICI
   ========================================================= */
const HER_NAME  = "Gracia";
const YOUR_NAME = "Roy";

/* =========================================================
   📜 MESSAGES PROGRESSIFS
   ========================================================= */
const messages = [
  "Tu es curieuse… j'aime bien ça.",
  "Continue, tu ne perds rien.",
  "Ça commence à devenir intéressant.",
  "Tu sais que ça me fait sourire ?",
  "Je prépare quelque chose pour toi.",
  "", // clic 6 → événement curiosité
  "Tu tiens le bon bout.",
  "Ferme les yeux deux secondes.",
  "", // clic 9 → événement glitch
  "L'ambiance devient plus douce, non ?",
  "Mon cœur bat un peu plus vite.",
  "J'ai quelque chose à te dire.",
  "Mais pas encore.",
  "Tu y es presque.",
  "Un dernier… et je te dis tout."
];

/* Textes du bouton selon le nombre de clics */
const buttonTexts = [
  { min: 0,  text: "Touche ici" },
  { min: 4,  text: "Encore une fois…" },
  { min: 7,  text: "Tu es sûre ? 👀" },
  { min: 10, text: "Bon… puisque tu insistes ❤️" },
  { min: 13, text: "Ouvre ton cœur" }
];

/* =========================================================
   🔗 RÉFÉRENCES DOM
   ========================================================= */
const intro      = document.getElementById('intro');
const introName  = document.getElementById('introName');
const enterBtn   = document.getElementById('enterBtn');
const stage      = document.getElementById('stage');
const title      = document.getElementById('title');
const messageEl  = document.getElementById('message');
const button     = document.getElementById('mainButton');
const blackout   = document.getElementById('blackout');
const light      = document.getElementById('light');
const preText    = document.getElementById('preLetterText');
const letter     = document.getElementById('letter');
const letterEl   = document.getElementById('letterContent');
const finale     = document.getElementById('finale');
const bigText    = document.getElementById('bigText');
const metaMsg    = document.getElementById('metaMessage');
const restartBtn = document.getElementById('restartBtn');
const canvas     = document.getElementById('bg-canvas');
const ctx        = canvas.getContext('2d');

/* Prénom dans l'intro */
introName.textContent = HER_NAME;

/* =========================================================
   ⏱️ UTILITAIRES
   ========================================================= */
const wait = ms => new Promise(r => setTimeout(r, ms));

/* =========================================================
   ✨ PARTICULES DE FOND
   ========================================================= */
let particles = [];
let W = 0, H = 0;

function resize() {
  W = canvas.width  = window.innerWidth;
  H = canvas.height = window.innerHeight;
}

class Particle {
  constructor() { this.reset(true); }
  reset(initial) {
    this.x = Math.random() * W;
    this.y = initial ? Math.random() * H : H + 15;
    this.size    = Math.random() * 1.7 + 0.4;
    this.speed   = Math.random() * 0.32 + 0.1;
    this.opacity = Math.random() * 0.45 + 0.08;
    this.drift   = (Math.random() - 0.5) * 0.22;
    this.hue     = 335 + Math.random() * 35;
  }
  update() {
    this.y -= this.speed;
    this.x += this.drift;
    if (this.y < -20) this.reset(false);
    if (this.x < -20) this.x = W + 20;
    if (this.x > W + 20) this.x = -20;
  }
  draw() {
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
    ctx.fillStyle = `hsla(${this.hue}, 80%, 72%, ${this.opacity})`;
    ctx.fill();
  }
}

function initParticles() {
  particles = [];
  const count = Math.min(85, Math.floor((W * H) / 24000));
  for (let i = 0; i < count; i++) particles.push(new Particle());
}

function loop() {
  ctx.clearRect(0, 0, W, H);
  for (const p of particles) { p.update(); p.draw(); }
  requestAnimationFrame(loop);
}

window.addEventListener('resize', () => { resize(); initParticles(); });
resize(); initParticles(); loop();

/* =========================================================
   🎬 INTRO → SCÈNE
   ========================================================= */
enterBtn.addEventListener('click', async () => {
  intro.classList.add('hidden');
  await wait(1400);
  intro.style.display = 'none';
  stage.classList.add('active');
  await wait(1600);

  messageEl.textContent = "Je t'attendais. Prends ton temps.";
  messageEl.classList.add('show');
});

/* =========================================================
   🎉 EFFETS VISUELS
   ========================================================= */
function burstHearts(intensity = 1) {
  const rect = button.getBoundingClientRect();
  const cx = rect.left + rect.width  / 2;
  const cy = rect.top  + rect.height / 2;
  const count = Math.round(12 + intensity * 10);

  for (let i = 0; i < count; i++) {
    const h = document.createElement('div');
    h.className = 'burst-heart';
    h.textContent = Math.random() < .25 ? '❤︎' : '❤';
    h.style.left = cx + 'px';
    h.style.top  = cy + 'px';
    h.style.fontSize = (10 + Math.random() * (12 + intensity * 8)) + 'px';
    h.style.color = `hsl(${335 + Math.random() * 25}, 78%, ${60 + Math.random() * 20}%)`;

    const angle = Math.random() * Math.PI * 2;
    const dist  = (70 + Math.random() * 120) * intensity;
    h.style.setProperty('--dx', Math.cos(angle) * dist + 'px');
    h.style.setProperty('--dy', Math.sin(angle) * dist + 'px');

    document.body.appendChild(h);
    setTimeout(() => h.remove(), 1700);
  }
}

function glitchScreen() {
  document.body.classList.add('glitching');
  setTimeout(() => document.body.classList.remove('glitching'), 950);
}

/* =========================================================
   🎭 ÉVÉNEMENT 1 — Analyse de curiosité (clic 6)
   ========================================================= */
async function eventCuriosityAnalysis() {
  const overlay = document.createElement('div');
  overlay.className = 'event-overlay';
  overlay.innerHTML = `
    <div class="event-content">
      <p class="event-title">Analyse de ton niveau de curiosité…</p>
      <div class="event-bar"><div class="event-fill"></div></div>
      <p class="event-pct">0%</p>
      <p class="event-verdict"></p>
    </div>
  `;
  document.body.appendChild(overlay);
  await wait(40);
  overlay.classList.add('show');

  const fill = overlay.querySelector('.event-fill');
  const pct  = overlay.querySelector('.event-pct');
  const verd = overlay.querySelector('.event-verdict');

  /* Barre qui monte à 87% puis "bug" à 100% */
  for (let p = 0; p <= 87; p += Math.random() * 8 + 3) {
    p = Math.min(p, 87);
    fill.style.width = p + '%';
    pct.textContent = Math.floor(p) + '%';
    await wait(110);
  }
  await wait(300);
  fill.style.width = '100%';
  pct.textContent = '100%';
  await wait(500);

  verd.textContent = "Diagnostic : beaucoup trop curieuse.";
  verd.classList.add('show');
  await wait(2400);

  overlay.classList.remove('show');
  await wait(700);
  overlay.remove();
}

/* =========================================================
   🎭 ÉVÉNEMENT 2 — Glitch (clic 9)
   ========================================================= */
async function eventGlitch() {
  glitchScreen();
  await wait(450);

  const overlay = document.createElement('div');
  overlay.className = 'event-overlay';
  overlay.innerHTML = `
    <div class="event-content">
      <p class="event-title">ATTENDS.</p>
      <p class="event-verdict show" style="margin-top:8px;font-size:1.05rem;color:rgba(248,229,229,.6)">
        Je crois que tu n'es pas censée être arrivée ici…
      </p>
    </div>
  `;
  document.body.appendChild(overlay);
  await wait(40);
  overlay.classList.add('show');
  await wait(2400);

  overlay.classList.remove('show');
  await wait(700);
  overlay.remove();
}

/* =========================================================
   🖱️ BOUTON PRINCIPAL
   ========================================================= */
let score = 0;
let transitioning = false;
const MAX = messages.length; // 15

function updateButtonText() {
  let text = buttonTexts[0].text;
  for (const t of buttonTexts) {
    if (score >= t.min) text = t.text;
  }
  button.textContent = text;
}

function showMessage(text) {
  messageEl.classList.remove('show');
  void messageEl.offsetWidth;
  messageEl.textContent = text;
  messageEl.classList.add('show');
}

button.addEventListener('click', async () => {
  if (transitioning) return;
  score++;

  /* Progression visuelle du halo */
  button.style.setProperty('--progress', (score / MAX).toFixed(2));

  /* Effets spéciaux */
  if (score === 3)  burstHearts(0.7);
  if (score === 5)  burstHearts(1);
  if (score === 6)  { await eventCuriosityAnalysis(); }
  if (score === 8)  { burstHearts(1.2); document.body.classList.add('rose-flash'); setTimeout(() => document.body.classList.remove('rose-flash'), 1100); }
  if (score === 9)  { await eventGlitch(); }
  if (score === 12) burstHearts(1.4);

  /* Message principal (sauf si c'est un clic d'événement) */
  if (score !== 6 && score !== 9) {
    showMessage(messages[score - 1]);
  }

  /* Titre évolutif */
  if (score === 5)  title.textContent = "Encore un peu…";
  if (score === 10) title.textContent = "Tu es tout près…";
  if (score === 14) title.textContent = "Un dernier…";

  updateButtonText();

  /* Transition finale */
  if (score >= MAX) {
    transitioning = true;
    button.disabled = true;
    burstHearts(1.8);
    await wait(900);
    transitionToLetter();
  }
});

/* =========================================================
   🎬 TRANSITION VERS LA LETTRE
   blackout → petite lumière → prénom → lettre
   ========================================================= */
async function transitionToLetter() {
  stage.classList.remove('active');
  await wait(1200);

  blackout.classList.add('active');
  await wait(1400);

  light.classList.add('active');
  await wait(1600);

  /* "Gracia…" */
  preText.textContent = HER_NAME + '…';
  preText.classList.add('show');
  await wait(2600);

  preText.classList.remove('show');
  await wait(700);

  /* "Il y a quelque chose que je voulais te dire." */
  preText.textContent = "Il y a quelque chose que je voulais te dire.";
  preText.classList.add('show');
  await wait(3000);

  preText.classList.remove('show');
  await wait(900);

  light.classList.remove('active');
  await wait(900);

  blackout.classList.remove('active');
  await wait(1500);

  letter.classList.add('active');
  await wait(600);
  showLetterLines();
}

/* =========================================================
   💌 LETTRE — LIGNES PROGRESSIVES
   ✏️ PERSONNALISE ICI
   ========================================================= */
const letterLines = [
  { text: `À toi, ${HER_NAME}.`, delay: 1200, cls: 'signature' },
  { text: '', delay: 300 },

  { text: "Je ne savais pas trop comment te le dire,", delay: 950 },
  { text: "alors j'ai préféré construire tout ça.", delay: 950 },
  { text: '', delay: 350 },

  { text: "Chaque petite lumière au fond de l'écran,", delay: 950 },
  { text: "c'est un peu de toi qui reste dans mes pensées.", delay: 950 },
  { text: "Chaque battement, c'est mon cœur qui parle.", delay: 950 },
  { text: '', delay: 350 },

  { text: "Tu es la personne qui rend", delay: 900 },
  { text: "mes jours ordinaires", delay: 800 },
  { text: "un peu moins ordinaires.", delay: 900 },
  { text: '', delay: 400 },

  { text: "Merci d'être toi.", delay: 850 },
  { text: "Merci de rire avec moi.", delay: 850 },
  { text: "Merci d'être là.", delay: 850 },
  { text: '', delay: 500 },

  { text: `— ${YOUR_NAME} ❤️`, delay: 1400, cls: 'signature' }
];

async function showLetterLines() {
  for (const line of letterLines) {
    const p = document.createElement('p');
    p.textContent = line.text;
    if (line.cls)   p.classList.add(line.cls);
    if (line.text === '') p.classList.add('empty');

    letterEl.appendChild(p);
    void p.offsetWidth;
    p.classList.add('show');

    /* Auto-scroll doux sur mobile */
    setTimeout(() => {
      p.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }, 180);

    await wait(line.delay);
  }

  await wait(2200);
  transitionToFinale();
}

/* =========================================================
   🏆 FINALE — "JE T'AIME." → lettres qui s'effacent → meta
   ========================================================= */
async function transitionToFinale() {
  letter.classList.remove('active');
  await wait(1400);

  finale.classList.add('active');
  await wait(900);

  /* Construire le texte lettre par lettre */
  const phrase = "JE T'AIME.";
  bigText.innerHTML = '';
  const spans = [];
  for (const ch of phrase) {
    const s = document.createElement('span');
    s.textContent = ch;
    s.style.opacity = '0';
    s.style.transform = 'translateY(14px)';
    bigText.appendChild(s);
    spans.push(s);
  }

  /* Apparition lettre par lettre */
  for (const s of spans) {
    s.style.opacity = '1';
    s.style.transform = 'translateY(0)';
    await wait(150);
  }

  await wait(2600);

  /* Effacement lettre par lettre */
  for (const s of spans) {
    s.style.opacity = '0';
    s.style.transform = 'translateY(-12px)';
    await wait(85);
  }

  await wait(900);

  /* Le message meta */
  metaMsg.classList.add('show');
  await wait(2600);

  restartBtn.classList.add('show');
}

/* =========================================================
   🔄 RESTART
   ========================================================= */
restartBtn.addEventListener('click', () => {
  location.reload();
});
</script>
