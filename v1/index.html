<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chaos Button</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root { --bg: #111; }

  body {
    min-height: 100vh;
    background: var(--bg);
    color: #fff;
    font-family: system-ui, Arial, sans-serif;
    overflow: hidden;
    transition: background .5s ease;
  }

  #world {
    min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    transition: transform .5s ease;
  }
  #world.reverse { transform: rotate(180deg); }
  #world.spin    { animation: spin .6s ease; }

  #shaker {
    display: flex; flex-direction: column; align-items: center;
    text-align: center; padding: 20px;
    transition: opacity 1s ease;
  }
  #shaker.shake { animation: shake .3s ease; }

  h1 { font-size: clamp(1.6rem, 6vw, 3rem); margin-bottom: 16px; }
  #score { font-size: 1.6rem; font-weight: bold; }

  #chaosButton {
    --scale: 1;
    margin-top: 30px; padding: 22px 44px;
    border: none; border-radius: 12px;
    background: #e50914; color: #fff;
    font-size: 1.25rem; font-weight: bold;
    white-space: nowrap; cursor: pointer; user-select: none;
    box-shadow: 0 0 30px rgba(255,0,0,.5);
    transform: scale(var(--scale));
    transition: transform .18s ease, left .35s ease, top .35s ease, background .3s ease;
  }
  #chaosButton:hover  { transform: scale(calc(var(--scale) * 1.08)); }
  #chaosButton:active { transform: scale(calc(var(--scale) * 0.92)); }
  #chaosButton.fleeing { position: fixed; margin: 0; z-index: 10; }

  #message {
    margin-top: 26px; min-height: 1.5em; max-width: 90vw;
    font-size: 1.1rem; color: #aaa;
    position: relative; z-index: 20;
  }

  #resetButton {
    margin-top: 18px; padding: 10px 20px;
    border: 1px solid #444; border-radius: 10px;
    background: transparent; color: #888;
    font-size: .9rem; cursor: pointer; transition: .2s;
    position: relative; z-index: 20;
  }
  #resetButton:hover { color: #fff; border-color: #888; }

  /* --- Calque des clones --- */
  #clones {
    position: fixed; inset: 0;
    pointer-events: none;
    z-index: 5;
  }
  .clone {
    position: fixed;
    padding: 14px 24px;
    border: none; border-radius: 10px;
    background: #ff4d00; color: #fff;
    font-weight: bold; font-size: 1rem;
    white-space: nowrap; cursor: pointer;
    pointer-events: auto; user-select: none;
    box-shadow: 0 0 20px rgba(255,100,0,.5);
    will-change: left, top, transform;
  }
  .clone.crazy {
    background: #7a00ff;
    box-shadow: 0 0 25px rgba(160,0,255,.7);
  }

  /* --- Mode panique (secret) --- */
  body.panic { animation: panic .5s infinite; }
  @keyframes panic {
    0%,100% { filter: hue-rotate(0deg) saturate(1); }
    50%     { filter: hue-rotate(90deg) saturate(2.5); }
  }

  /* --- Écran de fin --- */
  #endScreen {
    position: fixed; inset: 0;
    background: #000;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 28px; padding: 30px;
    z-index: 1000;
    text-align: center;
    animation: fadeIn 1.2s ease;
  }
  #endScreen h1 {
    font-size: clamp(1.4rem, 5.5vw, 3rem);
    color: #e50914;
    letter-spacing: .05em;
    text-shadow: 0 0 40px rgba(229,9,20,.8), 0 0 80px rgba(229,9,20,.4);
    animation: pulse 2.4s infinite;
    min-height: 1.2em;
  }
  #endScreen p {
    color: #777; font-size: 1.1rem;
    font-style: italic;
  }
  #endScreen button {
    padding: 14px 28px;
    border: 1px solid #444; border-radius: 10px;
    background: transparent; color: #fff;
    font-size: 1rem; cursor: pointer; transition: .25s;
  }
  #endScreen button:hover {
    background: #e50914; border-color: #e50914;
    transform: scale(1.05);
  }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes pulse  { 0%,100% { opacity: 1; } 50% { opacity: .55; } }

  /* --- Animations héritées --- */
  @keyframes shake {
    0%   { transform: translate(0,0); }
    25%  { transform: translate(10px,-10px); }
    50%  { transform: translate(-10px,10px); }
    75%  { transform: translate(10px,10px); }
    100% { transform: translate(0,0); }
  }
  @keyframes spin {
    from { transform: rotate(0deg); }
    to   { transform: rotate(360deg); }
  }
</style>
</head>

<body>

  <div id="world">
    <div id="shaker">
      <h1>⚠️ NE CLIQUE PAS</h1>
      <p>Clics : <span id="score">0</span></p>
      <button id="chaosButton">NE PAS CLIQUER</button>
      <p id="message"></p>
      <button id="resetButton" hidden>🔄 Recommencer</button>
    </div>
  </div>

  <div id="clones"></div>

<script>
  /* =========================================================
     🔗 RÉFÉRENCES DOM
     ========================================================= */
  const button     = document.getElementById('chaosButton');
  const scoreEl    = document.getElementById('score');
  const messageEl  = document.getElementById('message');
  const world      = document.getElementById('world');
  const shaker     = document.getElementById('shaker');
  const resetBtn   = document.getElementById('resetButton');
  const cloneLayer = document.getElementById('clones');

  /* =========================================================
     🧠 ÉTAT GLOBAL
     ========================================================= */
  const MAX_CLONES = 30;

  let score          = 0;
  let scale          = 1;
  let chaosLevel     = 0;   // 0 → 6
  let secretUnlocked = false;
  let surrendered    = false;
  let gameOver       = false;
  let cloneHits      = [];
  let multiplyTimer  = null;
  let mutateTimer    = null;

  /* =========================================================
     📜 TEXTES
     ========================================================= */
  const messages = [
    "Tu l'as fait... 😐", "Pourquoi ? 🤨",
    "Je t'avais dit de ne pas cliquer.",
    "Encore ? Sérieusement ? 💀",
    "Tu cherches les problèmes toi...",
    "Le bouton commence à avoir peur. 😨",
    "Arrête maintenant. 👀",
    "Je vais finir par me défendre.",
    "C'est ton passe-temps maintenant ? 😂",
    "Dernier avertissement. 😈",
    "Le bouton a appelé la police. 🚨",
    "Ce bouton a une famille tu sais. 😢",
    "Techniquement, c'est de la torture de bouton.",
    "Bravo. Tu as cassé l'univers. 🌌"
  ];

  const fleeTexts = [
    "ARRÊTE 😭", "NON !", "POURQUOI MOI ?", "NE CLIQUE PLUS",
    "TU INSISTES ? 💀", "JE VAIS M'ÉNERVER 😡", "CLIQUER = MAUVAIS CHOIX",
    "OK... DERNIER CLIC 😈", "ATTRAPE-MOI ! 🏃", "JE SUIS INNOCENT !"
  ];

  const cloneMessages = [
    "TU AS AUSSI CLIQUÉ SUR CELUI-LÀ ?! 😭",
    "MAIS ILS SE MULTIPLIENT ! 💀",
    "MÊME LES CLONES TE FONT CONFIANCE... 😔",
    "C'ÉTAIT UN BOUTON INNOCENT ! 😡",
    "TU N'AS AUCUNE LIMITE. 😨",
    "STOP. S'IL TE PLAÎT. 🙏",
    "CHAQUE CLIC CRÉE UN UNIVERS PARALLÈLE. 🌌"
  ];

  const rnd = arr => arr[Math.floor(Math.random() * arr.length)];

  /* =========================================================
     🛠️ UTILITAIRES
     ========================================================= */
  function flash(el, cls, ms) {
    el.classList.add(cls);
    setTimeout(() => el.classList.remove(cls), ms);
  }
  function setBg(color) {
    document.documentElement.style.setProperty('--bg', color);
  }
  function typewrite(el, text, speed, done) {
    el.textContent = '';
    let i = 0;
    const t = setInterval(() => {
      el.textContent += text[i++];
      if (i >= text.length) { clearInterval(t); if (done) done(); }
    }, speed);
  }

  /* =========================================================
     🏃 BOUTON PRINCIPAL : clamp + téléportation
     ========================================================= */
  function clampPosition() {
    if (!button.classList.contains('fleeing')) return;

    const w = button.offsetWidth;
    const h = button.offsetHeight;
    const padX = (w * scale - w) / 2;
    const padY = (h * scale - h) / 2;

    const maxX = Math.max(padX, window.innerWidth  - w - padX);
    const maxY = Math.max(padY, window.innerHeight - h - padY);

    const x = parseFloat(button.style.left) || 0;
    const y = parseFloat(button.style.top)  || 0;

    button.style.left = Math.min(Math.max(x, padX), maxX) + 'px';
    button.style.top  = Math.min(Math.max(y, padY), maxY) + 'px';
  }

  function teleport() {
    button.classList.add('fleeing');
    button.style.left = Math.random() * window.innerWidth  + 'px';
    button.style.top  = Math.random() * window.innerHeight + 'px';
    clampPosition();
  }

  /* =========================================================
     👻 CRÉATION DE CLONES
     nearX / nearY : position d'apparition (optionnel)
     ========================================================= */
  function createClone(nearX, nearY) {
    if (gameOver) return null;
    if (document.querySelectorAll('.clone').length >= MAX_CLONES) return null;

    const clone = document.createElement('button');
    clone.className = 'clone';
    if (chaosLevel >= 3) clone.classList.add('crazy');
    clone.textContent = rnd(fleeTexts);

    /* Taille + rotation initiales */
    const s = 0.8 + Math.random() * 0.6;
    const r = (Math.random() * 30 - 15).toFixed(1);
    clone.style.transform = `scale(${s}) rotate(${r}deg)`;

    /* Ajout au DOM pour pouvoir mesurer */
    cloneLayer.appendChild(clone);

    const maxX = Math.max(0, window.innerWidth  - clone.offsetWidth);
    const maxY = Math.max(0, window.innerHeight - clone.offsetHeight);

    let px, py;
    if (nearX !== undefined && nearY !== undefined) {
      const offX = (Math.random() - 0.5) * 120;
      const offY = (Math.random() - 0.5) * 120;
      px = Math.max(0, Math.min(maxX, nearX + offX));
      py = Math.max(0, Math.min(maxY, nearY + offY));
    } else {
      px = Math.random() * maxX;
      py = Math.random() * maxY;
    }
    clone.style.left = px + 'px';
    clone.style.top  = py + 'px';

    /* Vélocité (utilisée au niveau 2+) */
    clone._vx = (Math.random() - 0.5) * 3;
    clone._vy = (Math.random() - 0.5) * 3;

    /* === CLIC SUR LE CLONE === */
    clone.addEventListener('click', () => {
      if (gameOver) return;

      score++;
      scoreEl.textContent = score;
      messageEl.textContent = rnd(cloneMessages);

      registerCloneHit();
      checkProgression();

      /* 🔥 NIVEAU 4+ : le clone se clône en mourant */
      if (chaosLevel >= 4 && !surrendered) {
        const rect = clone.getBoundingClientRect();
        createClone(rect.left, rect.top);
        createClone(rect.left, rect.top);
      }

      /* Animation de disparition */
      clone.style.transition = 'transform .18s ease, opacity .18s ease';
      clone.style.transform  = 'scale(0) rotate(180deg)';
      clone.style.opacity    = '0';
      setTimeout(() => clone.remove(), 200);

      if (score >= 25) resetBtn.hidden = false;
    });

    return clone;
  }

  /* =========================================================
     🕵️ SECRET — 3 clones cliqués en 1 seconde
     (désactivé une fois le niveau 4 atteint, sinon trop facile)
     ========================================================= */
  function registerCloneHit() {
    if (secretUnlocked || chaosLevel >= 4) return;

    const now = performance.now();
    cloneHits.push(now);
    cloneHits = cloneHits.filter(t => now - t < 1000);

    if (cloneHits.length >= 3) unlockSecret();
  }

  function unlockSecret() {
    secretUnlocked = true;
    surrendered    = true;
    stopMultiplication();
    stopMutation();

    document.body.classList.add('panic');
    flash(world, 'spin', 600);
    setBg('hsl(280, 70%, 12%)');

    messageEl.textContent =
      "🎉 SECRET DÉBLOQUÉ : 3 CLONES EN 1 SECONDE. TU ES OFFICIELLEMENT UN PROBLÈME. 🏆";

    button.textContent = "BON... TU AS GAGNÉ 🏳️";
    button.classList.remove('fleeing');
    button.style.cssText = '';
  }

  /* =========================================================
     💀 NIVEAU 3 — multiplication automatique
     ========================================================= */
  function startMultiplication() {
    if (multiplyTimer) return;
    multiplyTimer = setInterval(() => {
      if (gameOver) return;
      if (document.querySelectorAll('.clone').length < MAX_CLONES) {
        createClone();
        if (Math.random() < 0.45) createClone();
      }
    }, 1400);
  }
  function stopMultiplication() {
    clearInterval(multiplyTimer);
    multiplyTimer = null;
  }

  /* =========================================================
     🧬 NIVEAU 5 — mutation des clones (texte + taille)
     ========================================================= */
  function startMutation() {
    if (mutateTimer) return;
    mutateTimer = setInterval(() => {
      if (gameOver) return;
      document.querySelectorAll('.clone').forEach(c => {
        c.textContent = rnd(fleeTexts);
        const s = 0.6 + Math.random() * 1.2;
        const r = (Math.random() * 40 - 20).toFixed(1);
        c.style.transform = `scale(${s}) rotate(${r}deg)`;
      });
    }, 1000);
  }
  function stopMutation() {
    clearInterval(mutateTimer);
    mutateTimer = null;
  }

  /* =========================================================
     📈 PROGRESSION PAR PALIERS
     ========================================================= */
  function checkProgression() {
    if (gameOver) return;

    if (score >= 30 && chaosLevel < 1) {
      chaosLevel = 1;
      messageEl.textContent = "IL VIENT DE SE CLONER TOUT SEUL. 😱";
      createClone(); createClone();
    }
    if (score >= 40 && chaosLevel < 2) {
      chaosLevel = 2;
      messageEl.textContent = "ILS BOUGENT. POURQUOI ILS BOUGENT ?! 🏃";
    }
    if (score >= 50 && chaosLevel < 3) {
      chaosLevel = 3;
      messageEl.textContent = "C'EST HORS DE CONTRÔLE. FÉLICITATIONS. 💀";
      document.querySelectorAll('.clone').forEach(c => c.classList.add('crazy'));
      startMultiplication();
    }
    if (score >= 60 && chaosLevel < 4) {
      chaosLevel = 4;
      messageEl.textContent = "LES CLONES SE CLONENT EUX-MÊMES. QU'AS-TU FAIT ?! 😱";
    }
    if (score >= 70 && chaosLevel < 5) {
      chaosLevel = 5;
      messageEl.textContent = "ILS MUTENT. ILS MUTENT ! 🧬";
      startMutation();
    }
    if (score >= 100 && chaosLevel < 6) {
      chaosLevel = 6;
      finalEnding();
    }
  }

  /* =========================================================
     🏆 FIN SECRÈTE — 100 CLICS
     ========================================================= */
  function finalEnding() {
    gameOver = true;
    stopMultiplication();
    stopMutation();

    /* Faire "exploser" les clones un par un */
    document.querySelectorAll('.clone').forEach((c, i) => {
      setTimeout(() => {
        c.style.transition = 'transform .6s ease, opacity .6s ease';
        c.style.transform  = 'scale(0) rotate(720deg)';
        c.style.opacity    = '0';
      }, i * 40);
    });
    setTimeout(() => { cloneLayer.innerHTML = ''; }, 1200);

    /* Fade out de l'interface principale */
    shaker.style.opacity = '0';
    shaker.style.pointerEvents = 'none';

    /* Écran de fin après le fade */
    setTimeout(() => {
      const endScreen = document.createElement('div');
      endScreen.id = 'endScreen';
      endScreen.innerHTML = `
        <h1 id="endTitle"></h1>
        <p id="endSub" style="opacity:0">${score} clics. Le chaos est total.</p>
        <button id="phoenixButton" style="opacity:0;pointer-events:none">
          🔥 Recommencer depuis le début
        </button>
      `;
      document.body.appendChild(endScreen);

      typewrite(
        document.getElementById('endTitle'),
        "TU N'AURAIS JAMAIS DÛ CLIQUER.",
        80,
        () => {
          const sub = document.getElementById('endSub');
          const btn = document.getElementById('phoenixButton');

          sub.style.transition = 'opacity .8s';
          sub.style.opacity    = '1';

          btn.style.transition = 'opacity .8s';
          btn.style.opacity    = '1';
          btn.style.pointerEvents = 'auto';

          btn.addEventListener('click', () => {
            endScreen.style.transition = 'opacity .5s';
            endScreen.style.opacity    = '0';
            setTimeout(() => {
              endScreen.remove();
              shaker.style.opacity = '1';
              shaker.style.pointerEvents = 'auto';
              fullReset("Le cycle recommence. 😈");
            }, 500);
          });
        }
      );
    }, 1300);
  }

  /* =========================================================
     🏃 BOUCLE D'ANIMATION — clones qui bougent (niveau 2+)
     ========================================================= */
  let lastT = performance.now();

  function tick(t) {
    const dt = Math.min((t - lastT) / 16.67, 3);
    lastT = t;

    if (chaosLevel >= 2 && chaosLevel < 6 && !gameOver) {
      document.querySelectorAll('.clone').forEach(c => {
        c._vx = Math.max(-8, Math.min(8, c._vx));
        c._vy = Math.max(-8, Math.min(8, c._vy));

        let x = parseFloat(c.style.left) || 0;
        let y = parseFloat(c.style.top)  || 0;

        const maxX = Math.max(0, window.innerWidth  - c.offsetWidth);
        const maxY = Math.max(0, window.innerHeight - c.offsetHeight);

        x += c._vx * dt;
        y += c._vy * dt;

        if (x <= 0 || x >= maxX) { c._vx *= -1; x = Math.max(0, Math.min(x, maxX)); }
        if (y <= 0 || y >= maxY) { c._vy *= -1; y = Math.max(0, Math.min(y, maxY)); }

        c.style.left = x + 'px';
        c.style.top  = y + 'px';
      });
    }
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);

  /* 🏃 NIVEAU 3+ : les clones fuient la souris */
  document.addEventListener('mousemove', e => {
    if (chaosLevel < 3 || gameOver) return;
    document.querySelectorAll('.clone').forEach(c => {
      const r  = c.getBoundingClientRect();
      const dx = (r.left + r.width / 2) - e.clientX;
      const dy = (r.top  + r.height / 2) - e.clientY;
      const d  = Math.hypot(dx, dy);
      if (d < 130 && d > 0.1) {
        c._vx += (dx / d) * 1.2;
        c._vy += (dy / d) * 1.2;
      }
    });
  });

  /* =========================================================
     🖱️ CLIC PRINCIPAL
     ========================================================= */
  button.addEventListener('click', () => {
    if (gameOver) return;

    if (surrendered) {
      fullReset("Le bouton s'est rendu. Tu peux respirer. 😮‍💨");
      return;
    }

    score++;
    scoreEl.textContent = score;
    messageEl.textContent = rnd(messages);

    /* 7+ : texte et taille aléatoires */
    if (score >= 7) {
      button.textContent = rnd(fleeTexts);
      scale = 0.6 + Math.random() * 1.2;
      button.style.setProperty('--scale', scale.toFixed(2));
      clampPosition();
    }

    /* 5+ : fuite une fois sur deux */
    if (score >= 5 && Math.random() < 0.5) teleport();

    /* 10+ : tremblement */
    if (score >= 10) flash(shaker, 'shake', 300);

    /* 15+ : événements aléatoires */
    if (score >= 15) {
      switch (Math.floor(Math.random() * 4)) {
        case 0: flash(world, 'spin', 600); break;
        case 1:
          setBg('hsl(0, 70%, 12%)');
          messageEl.textContent = "LE CHAOS EST ACTIVÉ. 😈";
          break;
        case 2:
          world.classList.add('reverse');
          messageEl.textContent = "Tout va bien. 🙂";
          setTimeout(() => world.classList.remove('reverse'), 4000);
          break;
        case 3:
          setBg(`hsl(${Math.random() * 360}, 70%, 15%)`);
          messageEl.textContent = "Pourquoi la couleur a changé ? 👀";
          break;
      }
    }

    /* 20+ : clone tous les 5 clics */
    if (score >= 20 && score % 5 === 0) {
      createClone();
      if (score >= 50) createClone();
    }

    checkProgression();

    if (score >= 25) resetBtn.hidden = false;
  });

  /* Le bouton principal esquive la souris (20+) */
  if (window.matchMedia('(hover: hover)').matches) {
    button.addEventListener('mouseenter', () => {
      if (score >= 20 && !surrendered && !gameOver && Math.random() < 0.6) teleport();
    });
  }

  /* =========================================================
     🔄 RESET
     ========================================================= */
  function fullReset(msg) {
    gameOver = false;
    score = 0; scale = 1; chaosLevel = 0;
    secretUnlocked = false; surrendered = false;
    cloneHits = [];

    stopMultiplication();
    stopMutation();

    scoreEl.textContent = '0';
    messageEl.textContent = msg || "Tout est réparé. Pour l'instant. 😇";

    button.textContent = 'NE PAS CLIQUER';
    button.classList.remove('fleeing');
    button.style.cssText = '';

    world.classList.remove('reverse', 'spin');
    document.body.classList.remove('panic');

    cloneLayer.innerHTML = '';
    setBg('#111');
    resetBtn.hidden = true;

    shaker.style.opacity = '1';
    shaker.style.pointerEvents = 'auto';
  }

  resetBtn.addEventListener('click', () => fullReset());
</script>
</body>
</html>
